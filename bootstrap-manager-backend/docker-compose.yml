version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: boattour_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boattour}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boattour_password}
      POSTGRES_DB: ${POSTGRES_DB:-boattour_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boattour}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - boattour_network

  api:
    build: .
    container_name: boattour_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-boattour}:${POSTGRES_PASSWORD:-boattour_password}@postgres:5432/${POSTGRES_DB:-boattour_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DEBUG: ${DEBUG:-False}
      APP_NAME: ${APP_NAME:-Boat Tour Manager}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    networks:
      - boattour_network

volumes:
  postgres_data:

networks:
  boattour_network:
    driver: bridge
